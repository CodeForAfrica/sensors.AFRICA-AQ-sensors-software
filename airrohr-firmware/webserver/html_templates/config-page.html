Rendered by webserver_config() 

Steps for serving page via GET request:
1. call start_html_page()
2. Add result form WEB_CONFIG_SCRIPT if wificonfig_loop is set to true
3. call webserver_config_send_body_get
    -add checkbox
    -add Form
        - list available WiFi networks
        - Add Table
           - WLAN SSID form input
           - WLAN password form input
        - Advanced settings
           - add form checkbox
           - table
              -username form input
              -password form input

        - Firmware version and OTA 
            - OTA checkbox
            - use beta firmware OTA checkbox
        - Select language table

        
4. Call send_html_page();

---->

  <script>
    function setSSID(ssid) {
      document.getElementById("wlanssid").value =
        ssid.innerText || ssid.textContent;
      document.getElementById("wlanpwd").focus();
    }
    function load_wifi_list() {
      var x = new XMLHttpRequest();
      x.open("GET", "/wifi");
      x.onload = function () {
        if (x.status === 200) {
          document.getElementById("wifilist").innerHTML = x.responseText;
        }
      };
      x.send();
    }
   </script>
